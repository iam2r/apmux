name: Release

# Changesets-driven releases (no conventional-commit parsing):
#   daily development happens on `develop` (all PRs target it; contributors do
#     NOT add change files — maintainers decide if/when to release)
#   maintainer pushes .changeset/*.md to `develop` to cut a release
#     → `prepare-release` job: Knope consumes the change files on the
#       `release` branch (Cargo.toml/Cargo.lock bump, CHANGELOG.md entry,
#       change files deleted) and force-pushes it, then opens/updates the
#       Release PR (release → main) for the maintainer to merge
#   maintainer merges the Release PR with a merge commit (not squash/rebase)
#     → `publish-release` job: if `apmux/vX.Y.Z` does not yet exist, tag the
#       merge commit and dispatch `release-build.yml` (GITHUB_TOKEN tag
#       pushes do not start workflows). A push that does not introduce a
#       new version only back-merges main → develop — no rebuild.
#     → `release-build.yml` tests, builds installers, publishes the GitHub
#       Release. Rebuild an existing tag via workflow_dispatch.
#
# `main` is release-only: never push features there. Hotfixes also go through
# `develop` (push it with a change file for the fastest path to a release).
#
# Auto-merge was removed: GITHUB_TOKEN merges do not start a fresh workflow
# and the "wait for merge_commit" loop was unreliable. Manual merge plus the
# push-to-main trigger is simpler and easier to reason about.
#
# Repo setting: Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches:
      - main
      - develop

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare-release:
    name: Prepare & upsert Release PR
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Skip when no pending changesets
        id: gate
        run: |
          if compgen -G ".changeset/*.md" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No pending changesets — nothing to release."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Git
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install Knope
        if: steps.gate.outputs.run == 'true'
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0
      - name: Consume changesets on the release branch
        if: steps.gate.outputs.run == 'true'
        run: knope prepare-release --verbose
      - name: Upsert Release PR
        id: pr
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(git show origin/release:Cargo.toml | sed -n 's/^version = "\([^"]*\)".*/\1/p' | head -n1)"
          TAG="apmux/v${VERSION}"
          echo "version=${VERSION} tag=${TAG}"
          {
            echo "This PR was created by the release pipeline."
            echo
            echo "**Merge with a merge commit** (not squash / rebase), leave the"
            echo "base as \`main\`, then merge. The push to \`main\` tags \`${TAG}\`,"
            echo "dispatches \`release-build.yml\`, and back-merges into develop."
            echo
            echo "## ${VERSION}"
            echo
            git show origin/release:CHANGELOG.md | awk '/^## / { n++ } n == 1' || true
          } > body.md
          if gh pr list --head release --state open --json number --jq 'length' | grep -q '^1$'; then
            gh pr edit release --base main --title "Release v${VERSION}" --body-file body.md
          else
            gh pr create --head release --base main \
              --title "Release v${VERSION}" --body-file body.md
          fi

  publish-release:
    name: Tag release & back-merge develop
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Ensure release tag exists for the merged version
        id: ensure-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read version from Cargo.toml"
            exit 1
          fi
          TAG="apmux/v${VERSION}"
          SHA="$(git rev-parse HEAD)"
          echo "version=${VERSION} tag=${TAG} sha=${SHA}"
          parents="$(git cat-file -p HEAD | grep -c '^parent ' || true)"
          if [ "${parents}" -lt 2 ]; then
            echo "::warning::HEAD is not a merge commit. Merge the Release PR with a merge commit (not squash/rebase) so back-merge into develop stays clean."
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 \
            || gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — skip tag push and asset rebuild."
            echo "Rebuild an existing tag via workflow_dispatch on release-build.yml."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          if ! git push origin "refs/tags/${TAG}"; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${SHA}"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "created ${TAG} at ${SHA}"
      # GITHUB_TOKEN tag pushes do not start a fresh workflow run, so explicitly
      # dispatch release-build.yml instead of relying on the `push: tags` filter.
      - name: Dispatch build workflow
        if: steps.ensure-tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ensure-tag.outputs.tag }}"
          gh workflow run release-build.yml -f "tag=${TAG}" \
            --repo "$GITHUB_REPOSITORY"
          echo "dispatched release-build.yml for ${TAG}"
      - name: Merge main back into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # bring the version bump + CHANGELOG from the merged Release PR back
          # into develop; conflict is essentially impossible (only the bot
          # writes Cargo.toml/CHANGELOG), but fail loudly rather than diverge
          # silently.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge --no-edit origin/main || {
            echo "::error::Merging main into develop conflicted — resolve manually and push."
            exit 1
          }
          git push origin develop
          echo "develop synced with main"
