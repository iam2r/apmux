name: Release build

# Binary build + GitHub Release assets. `publish-release` in release.yml
# dispatches this after creating a new `apmux/vX.Y.Z` tag (GITHUB_TOKEN tag
# pushes do not start workflows). `push: tags` is a fallback for PAT/manual
# tag pushes. Re-run via workflow_dispatch to rebuild an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to ship (e.g. apmux/v0.1.23)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to ship (e.g. apmux/v0.1.23)
        required: true
        type: string
  push:
    tags:
      - "apmux/v*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check tag shape
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            apmux/v*) ;;
            *)
              echo "::error::tag must look like apmux/vX.Y.Z (got '${RELEASE_TAG}')."
              exit 1
              ;;
          esac
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            target: aarch64-apple-darwin
            binary: apmux
          - os: macos-14
            platform: darwin-x64
            target: x86_64-apple-darwin
            binary: apmux
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            binary: apmux.exe
          - os: ubuntu-latest
            platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            binary: apmux
            musl_native: true
          - os: ubuntu-latest
            platform: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            binary: apmux
            use_cross: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.musl_native
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --locked

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --locked
        env:
          # Shrink panic/path strings baked into the binary.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=apmux

      - name: Strip
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if command -v strip >/dev/null 2>&1 && [[ "${{ matrix.binary }}" != *.exe ]]; then
            strip "$bin" || true
          fi
          ls -lh "$bin"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"

      - uses: actions/upload-artifact@v6
        with:
          name: apmux-${{ matrix.platform }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  universal-macos:
    name: Universal macOS
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apmux-darwin-arm64
          path: arm64
      - uses: actions/download-artifact@v7
        with:
          name: apmux-darwin-x64
          path: x64
      - name: lipo
        run: |
          mkdir -p universal
          lipo -create -output universal/apmux arm64/apmux x64/apmux
          chmod +x universal/apmux
          file universal/apmux
          ls -lh universal/apmux
      - uses: actions/upload-artifact@v6
        with:
          name: apmux-darwin-universal
          path: universal/apmux
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, universal-macos]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: apmux-*
      - name: Pack gzip/zip assets
        id: pack
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
          mkdir -p release-assets
          # Tag is `apmux/vX.Y.Z`; keep only the semver part for asset names.
          VERSION="${RELEASE_TAG##*/}"
          VERSION="${VERSION#v}"
          echo "release_name=apmux v${VERSION}" >> "$GITHUB_OUTPUT"

          pack_tar() {
            local name="$1"
            local src="$2"
            if [ -f "$src" ]; then
              tar -cf - -C "$(dirname "$src")" "$(basename "$src")" | gzip -9 > "release-assets/${name}.tar.gz"
            fi
          }

          pack_tar apmux-darwin-universal artifacts/apmux-darwin-universal/apmux
          pack_tar apmux-darwin-arm64 artifacts/apmux-darwin-arm64/apmux
          pack_tar apmux-darwin-x64 artifacts/apmux-darwin-x64/apmux
          pack_tar apmux-linux-x64-musl artifacts/apmux-linux-x64-musl/apmux
          pack_tar apmux-linux-arm64-musl artifacts/apmux-linux-arm64-musl/apmux

          if [ -f artifacts/apmux-windows-x64/apmux.exe ]; then
            (cd artifacts/apmux-windows-x64 && zip -9 "../../release-assets/apmux-windows-x64.zip" apmux.exe)
          fi

          cp install.sh install.ps1 release-assets/
          chmod 755 release-assets/install.sh

          (
            cd release-assets
            sha256sum * > checksums.txt
          )
          ls -lh release-assets/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.pack.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Linux / macOS:

            ```bash
            curl -fsSL https://github.com/iam2r/apmux/releases/latest/download/install.sh | bash
            ```

            Windows (PowerShell):

            ```powershell
            irm https://github.com/iam2r/apmux/releases/latest/download/install.ps1 | iex
            ```

            Linux assets are static musl builds. Archives are gzip/zip compressed.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
