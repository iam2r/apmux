name: CI

on:
  push:
  pull_request:
    branches:
      - develop
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: PR policy gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce contribution rules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail

          # Rule 1: PRs target `develop` only. `main` is release-only and only
          # accepts the bot's Release PR (head branch `release`).
          if [ "$BASE" = "main" ] && [ "$HEAD_REF" != "release" ]; then
            echo "::error::PRs must target the 'develop' branch — 'main' is release-only (bot Release PRs only)."
            echo "::error::请将 PR 目标分支改为 develop;main 仅用于发布,不接受功能/修复 PR。"
            exit 1
          fi

          # Rule 2: external contributors do not add change files — maintainers
          # write them when deciding to cut a release. The bot's Release PR
          # (head=release) is exempt: it carries the consumed change files
          # plus the version bump until they are deleted by the next prepare.
          FILES="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')"
          if echo "$FILES" | grep -q '^\.changeset/' \
            && [ "$HEAD_REF" != "release" ] \
            && ! echo "$ASSOC" | grep -Eq 'MEMBER|COLLABORATOR|OWNER'; then
            echo "::error::Do not add .changeset/ files in a PR — maintainers decide if/then to release and write the changelog."
            echo "::error::外部 PR 请勿包含 .changeset/ 文件:是否发版由维护者决定,变更说明由维护者统一撰写。"
            exit 1
          fi

          # Rule 3: the bot Release PR is always `release` → `main`. A retarget
          # to develop would merge the version bump without tagging.
          if [ "$HEAD_REF" = "release" ] && [ "$BASE" != "main" ]; then
            echo "::error::The Release PR must target 'main' (currently '$BASE')."
            echo "::error::Release PR 必须指向 main,不要改到 develop,否则不会打 tag / 发资产。"
            exit 1
          fi

          echo "PR policy OK (base=$BASE head=$HEAD_REF assoc=$ASSOC)"

  unix:
    name: fmt+clippy+test (linux)
    if: |
      github.event_name == 'pull_request' &&
      (github.base_ref == 'develop' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  windows:
    name: test (windows)
    if: |
      github.event_name == 'pull_request' &&
      (github.base_ref == 'develop' || github.base_ref == 'main')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test
